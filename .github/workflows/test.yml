name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall app.py agent.py tools.py data_loader.py prompts.py scoring.py long_haul.py voice_utils.py chat_store.py tests scripts
      - name: Pytest
        run: pytest tests/ -q
